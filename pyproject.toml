[project]
name = "ezio"
version = "0.1.0"
description = "EZIO — Entertainment Zone Intelligence & Optimization (AI-powered Search & Retrieval Engine)"
readme = "README.md"
authors = [
    { name = "Akshat", email = "akshatsonkar09@gmail.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "chromadb>=0.5.0",
    "contractions>=0.1.73",
    "fastapi>=0.115.0",
    "ftfy>=6.3.1",
    "groq>=0.11.0",
    "nltk>=3.9.1",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.5.0",
    "sentence-transformers>=3.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
]

[project.scripts]
ezio = "ezio:main"
project-black-knight = "project_black_knight:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.14.0"]
build-backend = "uv_build"
